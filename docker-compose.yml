# Local demo stack. Ports are published on 127.0.0.1 only; the API is not published at all (internal network).
# Required in .env: POSTGRES_PASSWORD, API_TOKEN (no insecure defaults). See README "Access".
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ddc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ddc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddc -d ddc"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ddc:${POSTGRES_PASSWORD}@db:5432/ddc
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      ENABLE_DATA_RESET: ${ENABLE_DATA_RESET:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGINS: http://localhost:3010
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8010
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      DEMO_BASIC_AUTH_USER: ${DEMO_BASIC_AUTH_USER:-}
      DEMO_BASIC_AUTH_PASSWORD: ${DEMO_BASIC_AUTH_PASSWORD:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3010:3010"

volumes:
  pgdata:
